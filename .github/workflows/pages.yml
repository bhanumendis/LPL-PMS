#
# Builds the single-file application and publishes it to GitHub Pages on every push to main.
# Enable once in the repository: Settings → Pages → Build and deployment → Source: GitHub Actions.
# The site is then served at https://<owner>.github.io/<repo>/ and can be tested live.
name: Deploy test site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # Runs the typecheck and the AAA contrast check before bundling; a failure stops the deploy.
      - run: npm run build
      - name: Stage the site
        run: |
          mkdir -p site
          cp dist/index.html site/index.html
          cp dist/LPL_Placement_Management_System.html site/LPL_Placement_Management_System.html
          touch site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
